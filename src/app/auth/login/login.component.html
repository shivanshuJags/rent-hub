<div class="wrapper">
    <h1 class="h1 mb-3 fw-normal text-center">Login</h1>
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <div *ngIf="isLoginError" class="text-danger mb-1">
            <div>Invalid Credentials</div>
        </div>
        <div class="form-floating my-2">
            <input type="email" formControlName="email" id="email" class="form-control" />
            <label for="email">Email address</label>
        </div>
        <div class="form-floating my-2">
            <input type="password" formControlName="password" id="password" class="form-control" />
            <label for="password">Password</label>
        </div>
        <button class="w-100 custom-button  my-2" type="submit" [disabled]="loginForm.invalid">Login</button>
    </form>
    <p class="login-switch my-2" (click)="switchToRegister()">
        Not a member? <span class="hyperlinks_small cursor-pointer">Register Now</span>
    </p>
</div>
